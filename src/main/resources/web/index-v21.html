<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Aurelis Symphony 2.3.1 — Temukan musik, dengarkan, buat playlist, dan nikmati lirik sinkron dalam satu pengalaman.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/aurelis.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/v21.css?v=2.3.1">
  <link rel="stylesheet" href="/assets/full-player.css?v=2.3.1">
  <link rel="stylesheet" href="/assets/preferences.css?v=2.3.1">
  <link rel="stylesheet" href="/assets/lyrics-v23.css?v=2.3.1">
  <title>Aurelis Symphony — Music, your way</title>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Navigasi utama">
      <button class="brand" data-nav="home" aria-label="Beranda Aurelis">
        <span class="brand-mark">✦</span>
        <span class="brand-copy"><strong>Aurelis</strong><small>SYMPHONY</small></span>
        <span class="version">2.3.1</span>
      </button>
      <div class="sidebar-section">
        <div class="sidebar-label">MENU UTAMA</div>
        <button class="nav-button active" data-nav="home"><i data-i="home"></i> <span>Beranda</span></button>
        <button class="nav-button" data-nav="search"><i data-i="search"></i> <span>Jelajahi</span></button>
        <button class="nav-button" data-nav="library"><i data-i="library"></i> <span>Koleksi Kamu</span></button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">MUSIK KAMU</div>
        <button class="nav-button" data-nav="liked"><i data-i="heart"></i> <span>Lagu Disukai</span></button>
        <button class="nav-button" data-nav="recent"><i data-i="clock"></i> <span>Baru Diputar</span></button>
        <div class="playlist-title"><span>PLAYLIST</span><button class="circle-mini" id="newPlaylistSide" aria-label="Buat playlist baru"><i data-i="plus"></i></button></div>
        <div id="sidePlaylists" class="side-playlists"></div>
      </div>
      <div class="sidebar-bottom"><span class="status-dot"></span><span id="sourceStatus">YouTube.js • Experimental Audio</span></div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark">✦</span><strong>Aurelis</strong></div>
        <div class="topbar-left">
          <button class="circle-button desktop-back" id="navBack" aria-label="Kembali"><i data-i="chevron-left"></i></button>
          <div class="global-search">
            <i data-i="search"></i>
            <input id="searchInput" type="search" aria-label="Cari musik" autocomplete="off" placeholder="Lagu, artis, album, atau suasana...">
            <kbd>/</kbd>
          </div>
        </div>
        <div class="top-actions">
          <span class="backend-pill"><span class="pulse-dot"></span><span id="backendLabel">YouTube.js</span></span>
          <button id="settingsButton" class="circle-button" aria-label="Pengaturan"><i data-i="settings"></i></button>
          <button class="profile-pic" data-nav="library" aria-label="Buka koleksi">A</button>
        </div>
      </header>

      <div class="scroll-area" id="scrollArea">
        <div id="view" class="view-content" aria-live="polite"></div>
        <footer class="app-footer"><span>✦ Aurelis Symphony 2.3.1</span><span>Find your frequency.</span></footer>
      </div>
    </main>

    <aside id="sidePanel" class="side-panel" aria-label="Panel pemutar" aria-hidden="true">
      <div class="panel-head">
        <div><span class="overline">AURELIS PLAYER</span><h2 id="panelHeading">Sedang Diputar</h2></div>
        <button class="circle-button" id="closePanel" aria-label="Tutup panel"><i data-i="x"></i></button>
      </div>
      <div class="panel-tabs">
        <button data-panel="now" class="selected">Detail</button>
        <button data-panel="lyrics">Lirik</button>
        <button data-panel="queue">Antrean</button>
      </div>
      <div id="panelContent" class="panel-content"></div>
    </aside>
  </div>

  <div id="miniPlayer" class="player-shell">
    <div class="player-track" id="playerTrack">
      <div id="playerArt" class="player-cover"><span>✦</span></div>
      <div class="player-track-copy"><strong id="playerTitle">Belum ada lagu</strong><small id="playerArtist">Putar lagu favoritmu</small></div>
      <button class="player-like" id="playerLike" aria-label="Sukai lagu"><i data-i="heart"></i></button>
    </div>
    <div class="player-center">
      <div class="transport">
        <button id="shuffleButton" class="ghost-button transport-small" aria-label="Acak"><i data-i="shuffle"></i></button>
        <button id="prevButton" class="ghost-button" aria-label="Sebelumnya"><i data-i="skip-back"></i></button>
        <button id="playButton" class="play-main" aria-label="Putar / Jeda"><i data-i="play"></i></button>
        <button id="nextButton" class="ghost-button" aria-label="Selanjutnya"><i data-i="skip-forward"></i></button>
        <button id="repeatButton" class="ghost-button transport-small" aria-label="Ulang"><i data-i="repeat"></i></button>
      </div>
      <div class="progress"><span id="elapsed">0:00</span><input id="seek" aria-label="Posisi lagu" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div>
    </div>
    <div class="player-extras">
      <button class="ghost-button" id="lyricsButton" aria-label="Lirik"><i data-i="mic"></i></button>
      <button class="ghost-button" id="queueButton" aria-label="Antrean"><i data-i="list"></i></button>
      <i data-i="volume" class="volume-icon"></i><input id="volume" type="range" aria-label="Volume" min="0" max="100" value="75">
      <button class="ghost-button" id="expandButton" aria-label="Buka pemutar"><i data-i="expand"></i></button>
    </div>
    <div class="mobile-progress"><div id="mobileProgress"></div></div>
  </div>

  <nav class="mobile-nav" aria-label="Navigasi mobile">
    <button data-nav="home" class="active"><i data-i="home"></i><span>Beranda</span></button>
    <button data-nav="search"><i data-i="search"></i><span>Cari</span></button>
    <button data-nav="library"><i data-i="library"></i><span>Koleksi</span></button>
    <button data-nav="liked"><i data-i="heart"></i><span>Disukai</span></button>
  </nav>

  <div id="scrim" class="scrim" hidden></div>
  <dialog id="playlistDialog" class="dialog">
    <form method="dialog" id="playlistForm">
      <span class="overline">KOLEKSI KAMU</span>
      <h2>Playlist baru</h2>
      <p>Berikan nama untuk koleksi musikmu.</p>
      <input name="name" id="playlistName" placeholder="Mis. Midnight Drive" maxlength="70" required>
      <div class="dialog-actions"><button type="button" id="playlistCancel" class="secondary-button">Batal</button><button type="submit" class="primary-button">Buat playlist</button></div>
    </form>
  </dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="/assets/v21.js?v=2.3.1" defer></script>
  <script src="/assets/full-player.js?v=2.3.1" defer></script>
  <script src="/assets/preferences.js?v=2.3.1" defer></script>
</body>
</html>
