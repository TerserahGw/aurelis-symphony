name: Mobile player browser smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/main/resources/web/assets/full-player.js
      - src/main/resources/web/assets/full-player.css
      - src/main/resources/web/assets/v21.js
      - src/main/resources/web/assets/preferences.js
      - src/main/resources/web/assets/preferences.css
      - src/main/resources/web/assets/lyrics-v23.css
      - src/main/resources/web/assets/glass-v24.css
      - src/main/resources/web/assets/glass-v25.css
      - src/main/resources/web/assets/island-v26.css
      - src/main/resources/web/assets/island-v26.js
      - server/recommend.mjs
      - src/main/resources/web/assets/media-session.js
      - server/lyrics.mjs
      - server/vendor/lirik-sync.mjs
      - src/main/resources/web/assets/docs.js
      - src/main/resources/web/docs/api.html
      - src/main/resources/web/index.html
      - .github/workflows/player-browser.yml
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser navigation
        env:
          HOST: 127.0.0.1
          PORT: '18080'
          AURELIS_DIRECT_AUDIO: 'false'
        run: |
          node server.mjs > /tmp/aurelis-browser-server.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const errors=[];
          async function scenario(width,height,mobile){
            const context=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile,locale:'id-ID'});
            const page=await context.newPage();
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:18080/',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForSelector('.music-card [data-action=play]',{timeout:50000});
            if(mobile){
              const count=await page.locator('#mobileIslandDock .island-nav [data-nav]').count();
              if(count!==3)throw new Error('Mobile dock has '+count+' items instead of Home, Search and Library');
              const miniVisible=await page.locator('#prevButton').isVisible()&&await page.locator('#playButton').isVisible()
                &&await page.locator('#nextButton').isVisible();
              if(!miniVisible)throw new Error('Floating mini-player must have prev/play/next');
              const bgCount=await page.locator('.island-ambient .island-wash').count();
              if(bgCount!==4)throw new Error('Artwork-driven ambient background not initialized');
              await page.locator('#islandSearchTrigger').click();
              await page.locator('#mobileIslandDock.is-searching').waitFor({state:'visible',timeout:4000});
              await page.locator('#islandSearchInput').fill('a');
              if(await page.locator('#searchInput').inputValue()!=='a')
                throw new Error('Island search did not sync the search field');
              await page.locator('#islandSearchClear').click();
              if(await page.locator('#islandSearchInput').inputValue()!=='')
                throw new Error('Search clear did not empty query');
              await page.locator('#islandMenuTrigger').click();
              if(await page.locator('#mobileIslandDock').evaluate(el=>el.classList.contains('is-searching')))
                throw new Error('Hamburger did not restore the navigation island');
              await page.locator('#mobileIslandDock [data-nav=library]').click();
              await page.locator('#view .library-tabs').waitFor({state:'visible'});
              if(await page.locator('#view [data-action=library-tab]').count()!==4)
                throw new Error('Library missing playlist/favorites/history categories');
              await page.locator('#view [data-action=library-tab][data-section=history]').click();
              if(!await page.locator('#view').textContent().then(t=>t.includes('Baru diputar')))
                throw new Error('History not accessible inside Library');
              await page.locator('#mobileIslandDock [data-nav=home]').click();
              await page.locator('.music-card [data-action=play]').first().waitFor({state:'visible'});
              await page.screenshot({path:'/tmp/aurelis-mobile-islands.png'});
            }
            await page.locator('.music-card [data-action=play]').first().click({timeout:10000});
            await page.locator('#playerTrack').click({timeout:10000});
            await page.waitForSelector('#fullPlayer.open',{timeout:8000});
            if(!await page.locator('#fpLyricsPane').isVisible())throw new Error('Lyrics not shown');
            // Regression: fullscreen's direct listener and the document action
            // delegate used to open AND immediately close the same popover.
            const fullscreenTrack=await page.evaluate(()=>window.Aurelis.snapshot().current);
            await page.locator('#fpMore').click({timeout:10000});
            await page.locator('#trackPopover').waitFor({state:'visible',timeout:4000});
            await page.waitForTimeout(120);
            if(!await page.locator('#trackPopover').isVisible())
              throw new Error('Fullscreen three-dot popover immediately closed');
            if(await page.locator('#fpMore').getAttribute('aria-expanded')!=='true')
              throw new Error('Fullscreen menu state not expanded');
            if(!await page.locator('#trackPopover [data-menu=download-lyrics]').isVisible())
              throw new Error('Fullscreen options missing');
            const popupLayout=await page.locator('#trackPopover').evaluate(el=>{
              const r=el.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight};
            });
            if(popupLayout.x<0||popupLayout.y<0||popupLayout.x+popupLayout.w>popupLayout.vw+1
               ||popupLayout.y+popupLayout.h>popupLayout.vh+2)
              throw new Error('Fullscreen popover exceeds viewport '+JSON.stringify(popupLayout));
            await page.locator('#trackPopover [data-menu=offset-plus]').click();
            if(!(await page.locator('#popOffsetValue').textContent()).includes('0.25'))
              throw new Error('Fullscreen lyric offset button unresponsive');
            // Restore the original offset so later baseline popover tests start at zero.
            await page.locator('#trackPopover [data-menu=offset-reset]').click();
            await page.locator('#fpMore').click();
            await page.locator('#trackPopover').waitFor({state:'hidden',timeout:3000});
            await page.locator('#fpMore').click();
            await page.locator('#trackPopover').waitFor({state:'visible',timeout:3000});
            const favoriteBefore=await page.evaluate(id=>window.Aurelis.snapshot().favorites.includes(id),fullscreenTrack.id);
            await page.locator('#trackPopover [data-menu=like]').click();
            const favoriteAfter=await page.evaluate(id=>window.Aurelis.snapshot().favorites.includes(id),fullscreenTrack.id);
            if(favoriteAfter===favoriteBefore)throw new Error('Fullscreen menu favorite action did not work');
            if(!await page.locator('#trackPopover').isHidden())throw new Error('Fullscreen popover stayed open after action');
            const glass=await page.locator('.player-shell').evaluate(el=>
              getComputedStyle(el).backdropFilter||getComputedStyle(el).webkitBackdropFilter);
            if(!glass.includes('blur'))throw new Error('Expanded Ambient Glass missing on mini-player');

            if(await page.locator('.fp-line-progress').count())throw new Error('Line timed lyrics must not show fabricated progress');
            const sessionMeta=await page.evaluate(()=>{
              const track=window.Aurelis?.snapshot?.().current;
              const m=navigator.mediaSession?.metadata;
              return {supported:!!navigator.mediaSession&&!!window.MediaMetadata,
                trackTitle:track?.title,trackArtist:track?.artist,
                title:m?.title,artist:m?.artist,artwork:m?.artwork?.length||0};
            });
            if(sessionMeta.supported && sessionMeta.trackTitle && (sessionMeta.title!==sessionMeta.trackTitle ||
               sessionMeta.artist!==sessionMeta.trackArtist || !sessionMeta.artwork))
              throw new Error('Media Session song title, artist or cover mismatch: '+JSON.stringify(sessionMeta));
            await page.locator('#fpQueueTab').click();
            if(!await page.locator('#fpAutoSwitch').isVisible())throw new Error('Queue/autoplay not shown');
            const old=await page.locator('#fpAutoSwitch').getAttribute('aria-checked');
            await page.locator('#fpAutoSwitch').click();
            const changed=await page.locator('#fpAutoSwitch').getAttribute('aria-checked');
            if(old===changed)throw new Error('Autoplay did not toggle');
            await page.locator('#fpLyricsTab').click();
            if(!(await page.locator('#fpRomanize').textContent()).includes('あ'))throw new Error('New romanization icon missing');
            const initialShuffle=await page.evaluate(()=>window.Aurelis.snapshot().shuffle);
            await page.locator('#fpShuffle').click();
            const shuffle=await page.evaluate(()=>window.Aurelis.snapshot().shuffle);
            if(shuffle===initialShuffle)throw new Error('Shuffle toggle did not update runtime state');
            const initialRepeat=await page.evaluate(()=>window.Aurelis.snapshot().repeat);
            await page.locator('#fpRepeat').click();
            const repeatOne=await page.evaluate(()=>window.Aurelis.snapshot().repeat);
            if(repeatOne!==(initialRepeat+1)%3)throw new Error('Repeat mode did not cycle');
            await page.locator('#fpRepeat').click();
            const repeatTwo=await page.evaluate(()=>window.Aurelis.snapshot().repeat);
            if(repeatTwo!==(repeatOne+1)%3)throw new Error('Repeat mode did not reach next state');
            await page.locator('#fpRepeat').click();
            await page.locator('#fpRomanize').click();
            await page.locator('#fpTranslate').click();
            await page.screenshot({path:'/tmp/aurelis-'+(mobile?'mobile':'desktop')+'.png'});
            await page.locator('#fpMore').click();
            await page.locator('#trackPopover').waitFor({state:'visible',timeout:3000});
            await page.locator('#fpClose').click();
            await page.locator('#trackPopover').waitFor({state:'hidden',timeout:3000});
            await page.locator('#fullPlayer').waitFor({state:'hidden',timeout:4500});
            await page.locator('#settingsButton').click();
            await page.locator('#aurelisPreferences').waitFor({state:'visible',timeout:5000});
            const settingsGlass=await page.locator('.asp-panel').evaluate(el=>
              getComputedStyle(el).backdropFilter||getComputedStyle(el).webkitBackdropFilter);
            if(!settingsGlass.includes('blur'))throw new Error('Settings not frosted glass');
            await page.locator('[data-tab=lyrics]').click();
            await page.locator('[data-range=lyricOffset]').evaluate(el=>{el.value='0.5';el.dispatchEvent(new Event('input',{bubbles:true}));});
            if(!(await page.locator('[data-output=lyricOffset]').textContent()).includes('0.5'))throw new Error('Lyric offset setting did not apply');
            await page.locator('[data-tab=data]').click();
            if(!await page.locator('[data-action=docs]').isVisible())throw new Error('Docs button missing');
            await page.screenshot({path:'/tmp/aurelis-'+(mobile?'mobile':'desktop')+'-settings.png'});
            await page.locator('#aspClose').click();
            await page.locator('.music-card .card-more').first().click({timeout:10000});
            await page.locator('#trackPopover').waitFor({state:'visible',timeout:4000});
            const songGlass=await page.locator('#trackPopover').evaluate(el=>
              getComputedStyle(el).backdropFilter||getComputedStyle(el).webkitBackdropFilter);
            if(!songGlass.includes('blur'))throw new Error('Song menu lacks glass effect');
            if(await page.locator('#trackPopover').evaluate(el=>el.getBoundingClientRect().width)>285)throw new Error('Song popover too large');
            await page.locator('#trackPopover [data-menu=offset-plus]').click();
            if(!(await page.locator('#popOffsetValue').textContent()).includes('0.25'))throw new Error('Song offset failed');
            await page.locator('#trackPopover [data-menu=offset-reset]').click();
            await page.locator('#trackPopover [data-menu=play]').click();
            const demoMenu=page.locator('.card-more[data-id="demo-aether"]').first();
            if(!await demoMenu.count())throw new Error('Aurelis Original demo menu missing');
            await demoMenu.click({timeout:10000});
            if(!await page.locator('#trackPopover [data-menu=download-audio]').isVisible())throw new Error('Download audio missing');
            if(!await page.locator('#trackPopover [data-menu=download-lyrics]').isVisible())throw new Error('Download lyrics missing');
            const audioDownloadEvent=page.waitForEvent('download',{timeout:10000});
            await page.locator('#trackPopover [data-menu=download-audio]').click();
            const audioDownload=await audioDownloadEvent;
            if(!audioDownload.suggestedFilename().endsWith('.mp3'))throw new Error('Demo audio is not MP3');
            await demoMenu.click({timeout:10000});
            const lyricDownloadEvent=page.waitForEvent('download',{timeout:10000});
            await page.locator('#trackPopover [data-menu=download-lyrics]').click();
            const lyricDownload=await lyricDownloadEvent;
            if(!lyricDownload.suggestedFilename().endsWith('.lrc'))throw new Error('Synced lyric did not download as LRC');
            await page.goto('http://127.0.0.1:18080/docs/api',{waitUntil:'domcontentloaded'});
            await page.locator('.docs-endpoint').first().waitFor();
            await page.locator('[data-try=health]').scrollIntoViewIfNeeded();
            await page.screenshot({path:'/tmp/aurelis-'+(mobile?'mobile':'desktop')+'-docs.png'});
            console.log('Docs geometry', await page.evaluate(()=>{
              const button=document.querySelector('[data-try=health]');
              const rect=button.getBoundingClientRect(), hit=document.elementFromPoint(rect.x+rect.width/2,rect.y+rect.height/2);
              return {button:{x:rect.x,y:rect.y,width:rect.width,height:rect.height},
                hit:hit?.outerHTML?.slice(0,140),side:document.querySelector('.docs-side')?.getBoundingClientRect().width,
                viewport:innerWidth};
            }));
            await page.locator('[data-try=health]').click({timeout:10000});
            await page.locator('#result-health').waitFor({state:'visible',timeout:5000});
            console.log((mobile?'Mobile':'Desktop')+' player/settings/popover/API docs OK');
            await context.close();
          }
          await scenario(393,852,true);
          await scenario(1240,800,false);
          await browser.close();
          if(errors.length)throw new Error('Browser page errors: '+errors.join(' | '));
          JS
      - name: Save UI screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-2-4-glass-lyrics-media-screenshots
          path: /tmp/aurelis-*.png
          if-no-files-found: ignore
