name: YouTube dual-engine audio diagnostic (non-blocking)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/stream.mjs
      - server/ytdl-fallback.mjs
      - package.json
      - .github/workflows/audio-diagnostic.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Probe real audio from two public YouTube IDs
        env:
          HOST: 127.0.0.1
          PORT: '18080'
          NODE_OPTIONS: --max-old-space-size=384
          AURELIS_DIRECT_AUDIO: 'true'
          AURELIS_YTDL_FALLBACK: 'true'
          AURELIS_STREAM_EVAL: 'false'
        run: |
          node -v
          node server.mjs > /tmp/audio.log 2>&1 &
          echo $! > /tmp/audio.pid
          sleep 4
          for video in MwpMEbgC7DA jNQXAC9IVRw; do
            echo "=== PROBE $video ==="
            curl --max-time 45 -sS -w '\nHTTP %{http_code} TIME %{time_total}\n' "http://127.0.0.1:18080/api/v2/audio/$video?probe=1" || true
            echo
          done
          echo '=== SOURCE STATUS ==='
          curl -sS http://127.0.0.1:18080/api/v2/status || true
          echo
          tail -n 30 /tmp/audio.log
          kill $(cat /tmp/audio.pid) || true
          exit 0
