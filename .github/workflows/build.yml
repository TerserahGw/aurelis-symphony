name: Build, test and publish Docker image
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax and offline HTTP tests
        run: |
          npm run check
          npm test
      - name: Verify production Docker image
        run: docker build -t aurelis-symphony:ci .
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/terserahgw/aurelis-symphony:latest,ghcr.io/terserahgw/aurelis-symphony:2.7.1
          labels: |
            org.opencontainers.image.source=https://github.com/TerserahGw/aurelis-symphony
            org.opencontainers.image.description=Aurelis Symphony 2.7.1 native audio player
          cache-from: type=gha
          cache-to: type=gha,mode=max
